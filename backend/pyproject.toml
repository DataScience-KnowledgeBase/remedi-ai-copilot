[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remedi-ai-copilot"
version = "1.0.0"
description = "Governed incident remediation using the official GitHub Copilot SDK"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.12.0",
  "github-copilot-sdk==1.0.25",
  "fastapi==0.140.0",
  "starlette==1.9.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic-settings==2.9.1",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.11.8",
  "pip-audit==2.9.0",
  "pip-tools==7.6.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
