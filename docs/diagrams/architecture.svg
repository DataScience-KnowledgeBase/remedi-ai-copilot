<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">RemediAI Copilot - solution architecture</title>
  <desc id="desc">Browser operators and owners use a local React console and FastAPI. Google ADK orchestrates bounded read-only tools through an isolated Copilot SDK runtime. Deterministic policy gates the simulator. SQLite persists queue, state, audit and learning candidates. Only synthetic evidence leaves the machine.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172b45}.h{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#52647b}.label{font-size:14px;fill:#52647b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.blue{fill:#edf4ff;stroke:#82a9ea}.teal{fill:#ecfdf5;stroke:#64bfa8}.amber{fill:#fffbeb;stroke:#d8ad4a}.purple{fill:#f5f0ff;stroke:#b09adb}.heading{font-size:19px;font-weight:700}.body{font-size:16px}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f6f8fc"/>
  <text x="44" y="54" class="h">RemediAI Copilot | Solution architecture</text>
  <text x="44" y="83" class="sub">Implemented pilot - local Docker deployment - single identity - synthetic remediation only</text>
  <rect x="34" y="115" width="1062" height="825" rx="20" fill="#eef2f8" stroke="#b6c3d5" stroke-dasharray="8 5"/>
  <text x="58" y="145" class="heading">LOCAL MACHINE / TRUST BOUNDARY</text>
  <rect x="68" y="178" width="270" height="94" class="box blue"/>
  <text x="90" y="211" class="heading">Operator / owner</text>
  <text x="90" y="237" class="body">Separate application role tokens</text>
  <text x="90" y="258" class="label">Operator ingests; owner approves</text>
  <rect x="393" y="178" width="294" height="94" class="box blue"/>
  <text x="415" y="211" class="heading">React + TypeScript console</text>
  <text x="415" y="237" class="body">Operations, approval, audit, metrics</text>
  <text x="415" y="258" class="label">nginx / localhost:8082</text>
  <path d="M338 223 H393" class="line"/>
  <rect x="393" y="331" width="294" height="112" class="box"/>
  <text x="415" y="365" class="heading">FastAPI + single worker</text>
  <text x="415" y="392" class="body">Auth, validation, queue admission</text>
  <text x="415" y="417" class="body">Idempotency, limits, crash recovery</text>
  <path d="M540 272 V331" class="line"/>
  <text x="554" y="306" class="label">REST + authenticated SSE</text>
  <rect x="68" y="332" width="270" height="111" class="box teal"/>
  <text x="90" y="365" class="heading">SQLite / persistent volume</text>
  <text x="90" y="392" class="body">Queue, state, audit, feedback</text>
  <text x="90" y="417" class="label">Append-only event triggers</text>
  <path d="M393 386 H338" class="line"/>
  <rect x="393" y="506" width="294" height="120" class="box purple"/>
  <text x="415" y="540" class="heading">ADK Runner / LlmAgent</text>
  <text x="415" y="567" class="body">Bounded evidence / action loop</text>
  <text x="415" y="594" class="body">Dynamic case: fresh reviewer</text>
  <text x="415" y="615" class="label">Custom BaseLlm bridge</text>
  <path d="M540 443 V506" class="line"/>
  <rect x="68" y="506" width="270" height="120" class="box teal"/>
  <text x="90" y="540" class="heading">ADK read-only tools</text>
  <text x="90" y="568" class="body">inspect_metrics()</text>
  <text x="90" y="594" class="body">read_runbook(action)</text>
  <text x="90" y="615" class="label">Synthetic evidence / exact runbooks</text>
  <path d="M393 565 H338" class="line"/>
  <rect x="752" y="506" width="310" height="120" class="box purple"/>
  <text x="774" y="540" class="heading">Isolated Copilot Python SDK</text>
  <text x="774" y="567" class="body">Managed runtime / JSON-RPC</text>
  <text x="774" y="594" class="body">Fresh session per controller step</text>
  <text x="774" y="615" class="label">No shell, filesystem, MCP or Git tools</text>
  <path d="M687 565 H752" class="line"/>
  <rect x="1140" y="500" width="268" height="140" class="box purple"/>
  <text x="1160" y="535" class="heading">GitHub Copilot service</text>
  <text x="1160" y="564" class="body">Configured authorized model</text>
  <text x="1160" y="591" class="body">claude-sonnet-5</text>
  <text x="1160" y="618" class="label">Subscription usage / policy applies</text>
  <path d="M1062 565 H1140" class="line"/>
  <text x="1110" y="459" class="label">External HTTPS egress</text>
  <text x="1110" y="480" class="label">Synthetic evidence only</text>
  <rect x="393" y="690" width="294" height="112" class="box amber"/>
  <text x="415" y="724" class="heading">Deterministic safety policy</text>
  <text x="415" y="751" class="body">Evidence, risk, confidence, review</text>
  <text x="415" y="777" class="body">Owner approval when required</text>
  <path d="M540 626 V690" class="line"/>
  <text x="554" y="662" class="label">Validated recommendation, not authority</text>
  <rect x="752" y="690" width="310" height="112" class="box teal"/>
  <text x="774" y="724" class="heading">Allowlisted simulator</text>
  <text x="774" y="751" class="body">Checkpoint, execute, 3 health probes</text>
  <text x="774" y="777" class="body">Close or restore checkpoint</text>
  <path d="M687 745 H752" class="line"/>
  <path d="M907 802 V862 H50 V468 H203 V443" class="line dash"/>
  <text x="384" y="889" class="label">Persist decisions, observed outcomes, audit and runbook-learning candidates</text>
  <rect x="1140" y="690" width="268" height="186" class="box amber"/>
  <text x="1160" y="724" class="heading">Safety boundaries</text>
  <text x="1160" y="755" class="body">LLM cannot approve or execute</text>
  <text x="1160" y="782" class="body">No real infrastructure adapter</text>
  <text x="1160" y="809" class="body">No automatic provider fallback</text>
  <text x="1160" y="836" class="body">Learning requires offline review</text>
  <text x="44" y="974" class="sub">Baseline: commit bec87e8 | ADK 2.12.0+remedi.1 (private build) | OpenTelemetry API/SDK 1.45.1 | 26 Oct 2026</text>
</svg>
