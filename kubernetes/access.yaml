apiVersion: v1
kind: ServiceAccount
metadata:
  name: remedi-agent
  labels:
    app.kubernetes.io/managed-by: remedi-ai
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remedi-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["remedi-crashloop", "remedi-oom", "remedi-imagepull", "remedi-pending"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remedi-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remedi-agent
subjects:
  - kind: ServiceAccount
    name: remedi-agent
    namespace: __NAMESPACE__
