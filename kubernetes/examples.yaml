apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedi-crashloop
  labels: {app.kubernetes.io/managed-by: remedi-ai, remedi.demo/target: remedi-crashloop}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {remedi.demo/target: remedi-crashloop}
  template:
    metadata:
      labels: {app.kubernetes.io/managed-by: remedi-ai, remedi.demo/target: remedi-crashloop}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: demo
          image: python:3.12-alpine
          command: ["python", "-B", "-u", "-c"]
          args:
            - |
              import os
              from http.server import HTTPServer, SimpleHTTPRequestHandler
              if os.environ.get("CRASH") == "true":
                  raise RuntimeError("Deliberate remedi demo startup failure")
              memory = bytearray(int(os.environ.get("ALLOCATE_MIB", "0")) * 1024 * 1024)
              HTTPServer(("0.0.0.0", 8080), SimpleHTTPRequestHandler).serve_forever()
          env: [{name: CRASH, value: "true"}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 1, periodSeconds: 2}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
